[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-typer"
version = "0.2.0"
description = "Camera-only QWERTY typing with glassmorphism UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyspellchecker>=0.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
optional-dependencies = {
    "dev" = ["ruff", "black", "mypy", "pytest", "pytest-cov"],
}

[project.scripts]
air-typer = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true